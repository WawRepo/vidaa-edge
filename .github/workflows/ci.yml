name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - run: npm run build:prod

      # Runtime dependencies only: a dev-only advisory never reaches the
      # published artifact. Report-only, because the current Angular range
      # carries advisories that can only be cleared by widening it - a
      # dependency decision, not a release-process one. Dependabot proposes
      # those bumps; this step keeps them visible in the meantime.
      - name: Audit runtime dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Verify npm package contents
        run: npm pack --dry-run

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR only accepts lowercase names, while a GitHub owner may contain
      # uppercase letters - so derive the image name rather than hardcoding it.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vidaa-edge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name vidaa-edge-ci -p 8443:8443 vidaa-edge:ci
          for i in $(seq 1 30); do
            if curl -ksf https://127.0.0.1:8443/ > /dev/null; then
              echo "Frontend responded"
              curl -ksf https://127.0.0.1:8443/api/functions > /dev/null && echo "API responded"
              docker rm -f vidaa-edge-ci
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy:"
          docker logs vidaa-edge-ci
          exit 1

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vidaa-edge:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Publish a rolling image from main so the latest code is installable
      # without burning a version number.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
