# Groups the auto-generated release notes by pull request label.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels: ['feature', 'enhancement']
    - title: Fixes
      labels: ['bug', 'fix']
    - title: Security
      labels: ['security']
    - title: Documentation
      labels: ['documentation', 'docs']
    - title: Build and CI
      labels: ['ci', 'build', 'chore']
    - title: Dependencies
      labels: ['dependencies']
    - title: Other changes
      labels: ['*']
