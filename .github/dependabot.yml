version: 2
updates:
  # Grouped so a week of dependency churn arrives as two pull requests rather
  # than twenty. Major bumps stay separate because they need a human read.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      angular:
        patterns: ['@angular*', 'zone.js', 'rxjs']
        update-types: ['minor', 'patch']
      nx:
        patterns: ['@nx/*', 'nx']
        update-types: ['minor', 'patch']
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['ci', 'dependencies']
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['dependencies']
